<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário</title>

<style>
body{
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    margin-top: 30px;
    background-color: #f2f2f2;
}

form{
    width: 400px;
    border: 1px solid #ccc;
    padding: 20px;
    border-radius: 10px;
    background-color: white;
}

h2{
    text-align: center;
    color: #2c3e50;
    margin-bottom: 15px;
}

input, select, textarea{
    width: 100%;
    padding: 8px;
    margin-top: 3px;
    margin-bottom: 10px;
    border: 1px solid #bbb;
    border-radius: 5px;
}

input:focus, select:focus, textarea:focus{
    border: 2px solid #3498db;
    outline: none;
}

button{
    padding: 8px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    background-color: #3498db;
    color: white;
}

button:hover{
    background-color: #2980b9;
}
</style>

</head>
<body>

<form>
    <h2>Cadastro</h2>

    <label>Nome:</label>
    <input type="text">

    <label>Gmail:</label>
    <input type="email">

    <label>Senha:</label>
    <input type="password">

    <label>Data de Nascimento:</label>
    <input type="date">

    <label>Curso:</label>
    <select>
        <option>ADS</option>
        <option>Engenharia de Software</option>
        <option>Ciencia da Computaçao</option>
    </select>

    <label>Sexo:</label><br>
    <input type="radio" name="sexo"> Masculino
    <input type="radio" name="sexo"> Feminino
    <br><br>

    <label>Interesses:</label><br>
    <input type="checkbox"> Tecnologia
    <input type="checkbox"> Jogos
    <input type="checkbox"> Musica
    <br><br>

    <label>Comentarios:</label>
    <textarea rows="4"></textarea>

    <label>Upload de foto:</label>
    <input type="file">

    <button type="submit">Enviar</button>
</form>

</body>
</html>
